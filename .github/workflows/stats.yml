name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:      # Allows you to manually trigger it anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: natebirdbyui
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Boise
          plugin_languages: yes
          plugin_languages_ignored: html, css, ejs
          plugin_languages_skipped: natebirdbyui

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update GitHub stats SVG"
          file_pattern: stats.svg